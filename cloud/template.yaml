AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ZoneLight on-demand cloud vision, floor geometry, lighting decisions and classroom history
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    ref: [docs/cloud.md]
Parameters:
  ClassroomId:
    Type: String
    Default: CLASSROOM-01
    AllowedPattern: '[A-Za-z0-9_-]{1,64}'
  FunctionConcurrency:
    Type: Number
    Default: 2
    AllowedValues: [0, 1, 2]
Resources:
  DeploymentArtifacts:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Private Lambda code and model artifacts only; no classroom images
        must: [Block public access, Enforce TLS, Preserve deployed artifacts]
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: OldArtifactVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
  ArtifactTLS:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DeploymentArtifacts
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt DeploymentArtifacts.Arn
              - !Sub '${DeploymentArtifacts.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  HistoryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: classroomId
          AttributeType: S
        - AttributeName: recordId
          AttributeType: S
      KeySchema:
        - AttributeName: classroomId
          KeyType: HASH
        - AttributeName: recordId
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
  DecisionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: cloud.vision_handler.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 2048
      Timeout: 60
      ReservedConcurrentExecutions: !Ref FunctionConcurrency
      FunctionUrlConfig:
        AuthType: AWS_IAM
      Environment:
        Variables:
          CLASSROOM_ID: !Ref ClassroomId
          HISTORY_TABLE: !Ref HistoryTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt HistoryTable.Arn
            - Effect: Allow
              Action: iot:DescribeEndpoint
              Resource: '*'
            - Effect: Allow
              Action: iot:Publish
              Resource:
                - !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/zonelight/${ClassroomId}/telemetry
                - !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/zonelight/${ClassroomId}/commands
  DecisionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${DecisionFunction}
      RetentionInDays: 7
  LaptopInvokePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Attach to the laptop AWS role to invoke only this lighting endpoint
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: lambda:InvokeFunctionUrl
            Resource: !GetAtt DecisionFunction.Arn
            Condition:
              StringEquals:
                lambda:FunctionUrlAuthType: AWS_IAM
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt DecisionFunction.Arn
            Condition:
              Bool:
                lambda:InvokedViaFunctionUrl: 'true'
Outputs:
  ArtifactBucketName:
    Value: !Ref DeploymentArtifacts
  FunctionUrl:
    Value: !GetAtt DecisionFunctionUrl.FunctionUrl
  FunctionArn:
    Value: !GetAtt DecisionFunction.Arn
  HistoryTableName:
    Value: !Ref HistoryTable
  LaptopInvokePolicyArn:
    Value: !Ref LaptopInvokePolicy
  TelemetryTopic:
    Value: !Sub zonelight/${ClassroomId}/telemetry
  CommandTopic:
    Value: !Sub zonelight/${ClassroomId}/commands
